<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice — ELA &amp; Mathematics</title>
<style>
:root{
  --ink:#16202e; --ink-soft:#5a6579; --ink-faint:#8b94a5;
  --rule:#dde3ec; --canvas:#eef1f6; --card:#fff;
  --accent:#1f5aa8; --accent-soft:#e9f0fa; --accent-deep:#16416f;
  --amber:#8a6114; --amber-bg:#fdf3dd; --amber-line:#e7cf9a;
  --danger:#b42318; --ok:#15803d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.wrap.wide{max-width:1400px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;
        align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{color:#93a3bb;font-weight:500}
.count{font-size:14px;color:#c2ccdb;font-variant-numeric:tabular-nums}
.track{height:3px;background:#0d1725}
.track i{display:block;height:100%;background:#5b9bd8;transition:width .25s ease}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      padding:32px 40px;margin:26px 0}
h1{font-size:28px;line-height:1.25;margin:0 0 14px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px}
.lede{color:var(--ink-soft);margin:0 0 20px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qnum{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
       padding:2px 8px;border-radius:4px}

/* ---------- split layout ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
       align-items:start;margin:22px 0}
.pane{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      display:flex;flex-direction:column;min-height:0}
.pane.passage{position:sticky;top:64px;max-height:calc(100vh - 92px)}
.pane.qs{padding:28px 32px}
.ptabs{display:flex;gap:3px;padding:7px 8px 0;border-bottom:1px solid var(--rule);
       flex-wrap:wrap;flex:none;background:#f7f9fc;border-radius:10px 10px 0 0}
.ptab{flex:none;border:1px solid transparent;border-bottom:none;background:none;
      padding:7px 10px;border-radius:7px 7px 0 0;font-size:12px;font-weight:600;
      color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.ptab:hover{background:#eef2f8;color:var(--ink)}
.ptab.on{background:#fff;border-color:var(--rule);color:var(--ink);
         box-shadow:0 1px 0 #fff;margin-bottom:-1px}
.ptab.done{color:var(--ink-faint);cursor:not-allowed;opacity:.65}
.ptab.done:hover{background:none;color:var(--ink-faint)}
.ptab .lk{font-size:11px;margin-right:4px}
.pbody{overflow-y:auto;padding:22px 30px 28px;font-family:var(--serif);
       font-size:16.5px;line-height:1.62;flex:1;min-height:0}
.pnotice{margin:0 0 14px;padding:9px 13px;border-radius:7px;background:var(--amber-bg);
         border:1px solid var(--amber-line);font-family:var(--ui);font-size:13px;
         color:var(--amber);display:flex;justify-content:space-between;gap:10px;
         align-items:center;flex-wrap:wrap}
.pnotice button{border:1px solid var(--amber-line);background:#fff;color:var(--amber);
       border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* ---------- passage typography ---------- */
.ptitle{text-align:center;font-size:19px;margin:6px 0 2px;font-family:var(--serif)}
.byline{text-align:center;font-style:italic;margin-bottom:16px;font-size:15px}
.phead{font-size:15.5px;font-style:italic;margin:20px 0 6px}
.pintro{font-style:italic;border-left:3px solid var(--rule);padding-left:14px;
        margin:6px 0 18px;color:#39445a}
.ppara{margin:11px 0;display:flex;gap:10px;align-items:flex-start}
.pnum{flex:none;width:20px;font-weight:700;font-size:13px;color:var(--ink-faint);
      font-family:var(--ui);padding-top:3px}
.pcredit,.pnote{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:12px 0 0}
.pnote{font-style:normal}
.stanza{margin:16px 0}
.pline{display:flex;gap:12px}
.lnum{flex:none;width:22px;text-align:right;color:var(--ink-faint);font-size:12.5px;
      font-family:var(--ui);padding-top:3px}
.pfig{margin:18px 0;text-align:center}
.pfig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px}

/* ---------- question body ---------- */
.stem{font-size:18.5px;line-height:1.58}
.stem p{margin:0 0 12px}
.stem ul{margin:10px 0 12px;padding-left:22px}
.stem blockquote{margin:12px 0;padding:12px 16px;background:#f7f9fc;
       border-left:3px solid #c3ccd9;border-radius:0 6px 6px 0;font-family:var(--serif);
       font-size:17px;line-height:1.55}
.disp{text-align:center;margin:18px 0;font-size:19px}
.disp.stack{line-height:2}
.qfig{text-align:center;margin:16px 0}
.stem svg{max-width:100%;height:auto}
.grid-in{margin-top:22px}
.grid-in label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);
     letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.grid-in input{width:230px;font-size:24px;font-family:inherit;font-weight:600;
     padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;color:var(--ink)}
.grid-in input:focus{outline:none;border-color:var(--accent);
     box-shadow:0 0 0 3px rgba(47,111,176,.16)}
.hint{font-size:13px;color:var(--ink-faint);margin-top:9px}
.qfig img{max-width:min(100%,470px);height:auto}
.frac{display:inline-block;vertical-align:middle;text-align:center;
      font-size:.92em;line-height:1.15;margin:0 2px}
.frac .num{display:block;padding:0 3px}
.frac .den{display:block;border-top:1px solid currentColor;padding:0 3px}
.ovl{border-top:1px solid currentColor}
sup{font-size:.72em;vertical-align:super;line-height:0}
sub{font-size:.72em;vertical-align:sub;line-height:0}
.tbl-title{text-align:center;font-size:14.5px;margin-bottom:7px;font-weight:600}
table.data{border-collapse:collapse;margin:0 auto 14px}
table.data th,table.data td{border:1px solid var(--ink);padding:5px 14px;
      font-size:15px;text-align:center}

/* ---------- choices ---------- */
.choices{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
        background:#fff;border:1.5px solid var(--rule);border-radius:8px;
        padding:13px 16px;cursor:pointer;font-size:17.5px;line-height:1.5;color:var(--ink);
        transition:border-color .12s,background .12s}
.choice:hover{border-color:#b9c4d4;background:#fafbfd}
.choice .ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #c3ccd9;
        display:flex;align-items:center;justify-content:center;font-size:13.5px;
        font-weight:700;color:var(--ink-soft);margin-top:1px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.note{font-size:13px;color:var(--ink-faint);max-width:380px}
.btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:8px;padding:13px 24px;font-size:16px;font-weight:600;
     cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--rule);
     padding:12px 18px}
.btn-ghost:hover{background:#f3f5f9;color:var(--ink)}
.btn:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}
.arrow{width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);
     color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;
     align-items:center;justify-content:center;transition:background .12s,transform .12s}
.arrow:hover{background:var(--accent-deep);transform:translateX(2px)}
.arrow.finish{background:var(--ok)}
.arrow.finish:hover{background:#136c34;transform:none}
.arrow:focus-visible{outline:3px solid #9dc3ec;outline-offset:3px}

/* ---------- start / results ---------- */
.rules{list-style:none;padding:0;margin:0 0 6px}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);
      font-size:16px;color:var(--ink-soft)}
.rules li:last-child{border-bottom:none}
.rules b{color:var(--ink);font-weight:650;flex:none;width:150px}
.picks{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.pick{flex:1;min-width:210px;text-align:left;background:#fff;border:1.5px solid var(--rule);
      border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .12s,background .12s}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font-size:17px;margin-bottom:3px}
.pick span{font-size:13.5px;color:var(--ink-faint)}
.stats{display:flex;gap:34px;margin:6px 0 22px;flex-wrap:wrap}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
table.sheet{width:100%;border-collapse:collapse;margin-top:6px}
table.sheet th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-faint);border-bottom:1.5px solid var(--rule);padding:8px 10px}
table.sheet td{border-bottom:1px solid #eef1f6;padding:8px 10px;font-size:15.5px;
      font-variant-numeric:tabular-nums}
table.sheet td.q{color:var(--ink-faint);width:52px}
.blank{color:var(--danger);font-weight:650}
.right{color:var(--ok);font-weight:650}
.wrong{color:var(--danger);font-weight:650}
.missed{font-size:16.5px;font-weight:600;color:var(--danger);margin:0 0 4px;
      font-variant-numeric:tabular-nums;line-height:1.6}
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 26px}
@media(max-width:800px){.sheetgrid{grid-template-columns:1fr}}

/* ---------- dialog / print ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,38,.55);
      display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:12px;padding:26px 28px;max-width:430px;width:100%;
      box-shadow:0 18px 50px rgba(10,18,32,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}
.printhead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.ph-title{font-size:15px;font-weight:700}
.ph-meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.namefield{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.namefield label{font-size:13px;font-weight:600;color:var(--ink-soft);width:104px}
.namefield input{flex:1;min-width:210px;max-width:300px;font-family:var(--ui);font-size:15px;
      padding:8px 12px;border:1.5px solid #c3ccd9;border-radius:8px}
.namefield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tip{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .pane.passage{position:static;max-height:52vh}
  .pane.qs{padding:22px 20px}
}
@media(max-width:640px){
  .card{padding:22px 18px}
  .bar-in{padding:9px 14px}.wrap{padding:0 12px}
  h1{font-size:22px}.stem,.choice{font-size:16.5px}
  .actions{flex-direction:column;align-items:stretch}
  .btns{justify-content:space-between}.note{max-width:none}
  .arrow{width:54px;height:54px;font-size:25px}
  .rules b{width:auto}
  .rules li{flex-direction:column;gap:2px}
}
@media print{
  @page{margin:14mm}
  .bar,.track,.actions,.noprint,.modal,.namefield{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:none;margin:0;padding:0;border-radius:0}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:13px;margin:14px 0 6px}
  .stats{gap:24px;margin:4px 0 12px}.stat .v{font-size:19px}
  .sheetgrid{gap:0 18px}
  table.sheet td,table.sheet th{padding:2.5px 7px;font-size:11px}
  tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>
<div class="track" id="track" hidden><i id="trackbar" style="width:0%"></i></div>
<main id="app"></main>

      <button class="btn btn-ghost" id="modal-no">Cancel</button>
      <button class="btn btn-primary" id="modal-yes">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var DATA = {"texts": {"lib": {"label": "The Local Library", "html": "<h3 class=\"ptitle\">The Local Library</h3>\n<p class=\"ppara\"><span>(1) According to a 2015 survey, more than two-thirds of Americans own a smartphone, which means that obtaining information or communicating with people is easier than ever before. (2) With the swipe of a finger, the tap of an icon, or a verbal command, people have instant access to articles, blogs, news, and social networking websites. (3) Even with all these immediately available sources of information, one of the best resources for many members of the community also happens to be one of the oldest. (4) The public library is a great place for people to get information.</span></p>\n<p class=\"ppara\"><span>(5) The public library serves a truly critical role in promoting community. (6) With the explosion of digital media in recent years, people in different locations can now communicate almost instantaneously. (7) And yet many people complain of feeling more isolated and alone than ever before. (8) The library stands in a rare position to help community members meet this universal need for human connection and companionship.</span></p>\n<p class=\"ppara\"><span>(9) Furthermore, libraries provide certain amenities, such as access to the Internet, for free to all people. (10) A student who does not have a computer at home can research and type a paper for school. (11) Similarly, an unemployed adult without access to the Internet can make use of library resources to find job opportunities. (12) The free items that are found at the library can help people get a lot done.</span></p>\n<p class=\"ppara\"><span>(13) Public libraries also offer a variety of resources to community members. (14) One important resource is the local librarian, who does far more than check out books and collect fines. (15) Other library resources include free or low-cost tutoring and training programs. (16) Additionally, lectures, book groups, and town meetings promote critical thinking and community engagement. (17) A typical librarian holds a master’s degree and can help library patrons navigate through the flood of information available in print and on the Internet.</span></p>\n<p class=\"ppara\"><span>(18) The hallmark of a public library is that its materials and services are accessible to all. (19) The library connects people to a network of information and resources and is an important part of a community.</span></p>"}, "tung": {"label": "The Tunguska Fireball", "html": "<h3 class=\"ptitle\">The Tunguska Fireball</h3>\n<p class=\"ppara\"><span class=\"pnum\">1</span><span>On June 30, 1908, an enormous fireball shot across the sky and exploded high above the remote Tunguska River Valley in the Siberian region of Russia. Twenty miles away, huts were flattened and people were flung into the air. Villagers 40 miles away felt the heat and heard explosions, and tremors were recorded at a German seismic station more than 3,000 miles away.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">2</span><span>What caused the intense light and the horrendous destruction of the Tunguska Fireball, as it came to be called? Scientists and laypeople have debated the question for over 100 years. Not until 1927 did a scientific expedition, led by Russian scientist Leonid Kulik, reach the remote site. Kulik discovered a vast region of scorched and downed trees, their trunks pointing away from the center of the blast. Convinced that a meteorite was responsible, Kulik searched for evidence—a crater, a buried meteorite, even fragments of the exploded mass. He never found it.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">3</span><span>Other scientists, amateur astronomers, and the public suggested alternative theories of what had happened. Some thought it was an earthquake. Perhaps, others said, a black hole—a theoretical object in space where gravity is so strong that even light cannot get out—had collided with Earth or an alien spaceship carrying nuclear material had crashed.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">4</span><span>For many years Russian scientists believed that the Tunguska Fireball was a comet—a cluster of dust and frozen gases—that had exploded a few hundred feet above the ground. They pointed to the lack of meteoric evidence and the June 30 date, a time of year when Earth was passing through cometary debris. Other scientists disagreed, arguing that a comet would have burned quickly in Earth’s atmosphere and could not have created such a blast.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">5</span><span>Many Western scientists believed that a meteorite was responsible, despite the lack of evidence. The pattern of fallen trees suggested that they were knocked down by a blast about 4 miles above the ground with an energy of 15 megatons of TNT, consistent with a meteoric blast. Yet repeated searches of the surrounding forest and wetlands revealed no evidence of a meteorite.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">6</span><span>During the 1990s an Italian physicist named Menotti Galli became interested. Galli had previously investigated whether particles from outer space can add carbon atoms to the cellulose in trees. Perhaps the trees at the Tunguska site hid evidence of such extraterrestrial material. Galli and his colleagues traveled to the site by helicopter to gather core samples from spruce trees that had lived through the blast. They analyzed the particles trapped in the trees’ resin, and the results were remarkable. Based on studying the trees’ rings during the time period when the Tunguska Fireball occurred, the researchers found that the resin contained high levels of high-proton elements, such as copper, gold, and nickel. In fact, it contained ten times more such particles than resin dating from either before or after that time period. Some previously discovered meteorites had also contained elevated levels of these elements, suggesting that the particles had an extra-earthly origin. But then where is the crater? Is it nearby Lake Cheka, as some claim? Or was the meteorite reduced to dust in the atmosphere? Can scientists rule out a comet carrying those elements? The mystery remains unsolved.</span></p>"}, "wild": {"label": "A Voice in the Wilderness", "html": "<h3 class=\"ptitle\">Excerpt from A Voice in the Wilderness</h3>\n<div class=\"byline\">by Grace Livingston Hill</div>\n<p class=\"ppara\"><span class=\"pnum\">1</span><span>With a lurch the train came to a dead stop and Margaret Earle, hastily gathering up her belongings, hurried down the aisle and got out into the night.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">2</span><span>It occurred to her, as she swung her heavy suit-case down the rather long step to the ground, and then carefully swung herself after it, that it was strange that neither conductor, brakeman, nor porter had come to help her off the train, when all three had taken the trouble to tell her that hers was the next station; but she could hear voices up ahead. Perhaps something was the matter with the engine that detained them and they had forgotten her for the moment.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">3</span><span>The ground was rough where she stood, and there seemed no sign of a platform. Did they not have platforms in this wild Western land, or was the train so long that her car had stopped before reaching it?</span></p>\n<p class=\"ppara\"><span class=\"pnum\">4</span><span>She strained her eyes into the darkness, and tried to make out things from the two or three specks of light that danced about like fireflies in the distance. She could dimly see moving figures away up near the engine, and each one evidently carried a lantern. The train was tremendously long. A sudden feeling of isolation took possession of her. Perhaps she ought not to have got out until some one came to help her. Perhaps the train had not pulled into the station yet and she ought to get back on it and wait. Yet if the train started before she found the conductor she might be carried on somewhere and he justly blame her for a fool.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">5</span><span>There did not seem to be any building on that side of the track. It was probably on the other, but she was standing too near the cars to see over. She tried to move back to look, but the ground sloped and she slipped and fell in the cinders,1 bruising her knee and cutting her wrist.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">6</span><span>In sudden panic she arose. She would get back into the train, no matter what the consequences. They had no right to put her out here, away off from the station, at night, in a strange country. If the train started before she could find the conductor she would tell him that he must back it up again and let her off. He certainly could not expect her to get out like this.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">7</span><span>She lifted the heavy suit-case up the high step that was even farther from the ground than it had been when she came down, because her fall had loosened some of the earth and caused it to slide away from the track. Then, reaching to the rail of the step, she tried to pull herself up, but as she did so the engine gave a long snort and the whole train, as if it were in league against her, lurched forward crazily, shaking off her hold. She slipped to her knees again, the suit-case, toppled from the lower step, descending upon her, and together they slid and rolled down the short bank, while the train . . . ran giddily off into the night.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">8</span><span>The horror of being deserted helped the girl to rise in spite of bruises and shock. She lifted imploring hands to the unresponsive cars as they hurried by her—one, two, three, with bright windows, each showing a passenger, comfortable and safe inside, unconscious of her need. cinders: track bed made from the residue of burnt coal</span></p>\n<p class=\"ppara\"><span class=\"pnum\">9</span><span>A moment of useless screaming, running, trying to attract some one’s attention, a sickening sense of terror and failure, and the last car slatted itself past with a mocking clatter, as if it enjoyed her discomfort.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">10</span><span>Margaret stood dazed, reaching out helpless hands, then dropped them at her sides and gazed after the fast-retreating train, the light on its last car swinging tauntingly, blinking now and then with a leer in its eye, rapidly vanishing from her sight into the depth of the night.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">11</span><span>She gasped and looked about her for the station that but a short moment before had been so real to her mind; and, lo! on this side and on that there was none!</span></p>\n<p class=\"ppara\"><span class=\"pnum\">12</span><span>The night was wide like a great floor shut in by a low, vast dome of curving blue set with the largest, most wonderful stars she had ever seen. Heavy shadows of purple-green, smoke-like, hovered over earth darker and more intense than the unfathomable blue of the night sky. It seemed like the secret nesting-place of mysteries wherein no human foot might dare intrude. It was incredible that such could be but common sage-brush, sand, and greasewood wrapped about with the beauty of the lonely night.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">13</span><span>No building broke the inky outlines of the plain, nor friendly light streamed out to cheer her heart. Not even a tree was in sight, except on the far horizon, where a heavy line of deeper darkness might mean a forest. Nothing, absolutely nothing, in the blue, deep, starry dome above and the bluer darkness of the earth below save one sharp shaft ahead like a black mast throwing out a dark arm across the track.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">14</span><span>As soon as she sighted it she picked up her baggage and made her painful way toward it, for her knees and wrist were bruised and her baggage was heavy.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">15</span><span>A soft drip, drip greeted her as she drew nearer; something plashing down among the cinders by the track. Then she saw the tall column with its arm outstretched, and looming darker among the sage-brush the outlines of a water-tank. It was so she recognized the engine’s drinking-tank, and knew that she had mistaken a pause to water the engine for a regular stop at a station.</span></p>\n<p class=\"pcredit\">From A VOICE IN THE WILDERNESS by Grace Livingston Hill—Public Domain</p>"}, "arch": {"label": "Uncovering the Past", "html": "<h3 class=\"ptitle\">Uncovering the Past</h3>\n<p class=\"ppara\"><span class=\"pnum\">1</span><span>Archaeology as a distinct branch of science is only about two centuries old. The first archaeological activities focused largely on the search for clues about earlier human societies. In the nineteenth century, most archaeologists were amateurs trained in ancient languages and history. Many were art historians whose interest lay in the artwork and monuments of ancient civilizations. For the most part, their excavations were aimed at uncovering and removing priceless artwork and other valuable artifacts for museum display. Collectively, these early archaeologists are now considered traditional archaeologists.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">2</span><span>Today, however, there is a different approach to archaeology, one that tries to reconstruct the everyday life of people in ancient times by applying the scientific methods of a range of specialized fields. Modern archaeologists take full advantage of available technology. Laptop computers enable digging teams to record their finds at each level of an excavation. With sketchpad computer software, archaeologists can draw their finds in the field. Three-dimensional computer modeling enables researchers to create floor plans and elevations for the structures they uncover. Archaeologists can also use remote sensing technologies such as radar and lidar, which is similar to radar but it uses laser light instead of radio waves. These technologies enable scientists to detect traces of early settlements that are not visible to the human eye.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">3</span><span>The excavations at Kourion, a Roman port city on the island of Cyprus in the Mediterranean Sea, serve as an example of the modern approach. Portions of Kourion had been unexpectedly buried by a massive earthquake in the fourth century A.D. Traditional archaeologists were interested primarily in the remains of Kourion’s theater, temple, and classical monuments. They also collected precious objects, such as jewelry, found in nearby tombs. Modern archaeologists, however, have focused their studies and excavations on the settlement itself. This preserved seaport has proved to be a gold mine of important information about everyday life sixteen centuries ago.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">4</span><span>During one excavation of a house at Kourion, for example, forensic anthropologists were able to reconstruct the skeleton of a young girl, whom they called Camelia. On the basis of her teeth, they determined her age to be about thirteen, although measurement of her skeleton showed that she was only the size of a modern eleven-year-old. The study of the teeth also confirmed her sex and pointed to her excellent health; Camelia had no cavities. Even after centuries, the forensic scientists could study the physical evidence in ways similar to those used in criminal investigations to determine the circumstances of Camelia’s death.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">5</span><span>Other specialists on this excavation included a zooarchaeologist, who identified animal remains, including the skeleton of a mule found near Camelia. Another specialist, a paleobotanist, studied the contents of a bake oven at the site and identified four domesticated grains among the charred crumbs—evidence of a kind of ancient multigrain bread.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">6</span><span>Although the archaeologists at this site unearthed a few beautiful items, the excavation did not uncover any priceless artwork for museums. Nonetheless, the archaeological processes used in Kourion have given us a valuable insight into everyday life in a Roman city.</span></p>"}, "poem": {"label": "Snowy Mountains", "html": "<h3 class=\"ptitle\">Snowy Mountains</h3>\n<div class=\"byline\">by John Gould Fletcher</div>\n<div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span>Higher and still more high,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Palaces made for cloud,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Above the dingy city-roofs</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Blue-white like angels with broad wings,</span></div><div class=\"pline\"><span class=\"lnum\">5</span><span>Pillars of the sky at rest</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The mountains from the great plateau</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Uprise.</span></div></div>\n<div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span>But the world heeds them not;</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>They have been here now for too long a time.</span></div><div class=\"pline\"><span class=\"lnum\">10</span><span>The world makes war on them,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Tunnels their granite cliffs,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Splits down their shining sides,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Plasters their cliffs with soap-advertisements,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Destroys the lonely fragments of their peace.</span></div></div>\n<div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\">15</span><span>Vaster and still more vast,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Peak after peak, pile after pile,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Wilderness still untamed,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>To which the future is as was the past,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Barrier spread by Gods,</span></div><div class=\"pline\"><span class=\"lnum\">20</span><span>Sunning their shining foreheads,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Barrier broken down by those who do not need</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The joy of time-resisting storm-worn stone,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The mountains swing along</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The south horizon of the sky;</span></div><div class=\"pline\"><span class=\"lnum\">25</span><span>Welcoming with wide floors of blue-green ice</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The mists that dance and drive before the sun.</span></div></div>\n<p class=\"pcredit\">“Snowy Mountains” by John Gould Fletcher—Public Domain</p>"}, "tele": {"label": "Invention of the Telegraph", "html": "<p class=\"pintro\">Samuel Morse, an American inventor, is credited with creating the electronic telegraph, a communication device that allows users to send messages using a system of short and long pulses that represent letters, numbers, and punctuation. In 1844 the United States Congress passed the Telegraph Bill, which provided Morse with the funds to build an electric telegraph system.</p>\n<h3 class=\"ptitle\">Invention of the Telegraph</h3>\n<h4 class=\"phead\">Earlier Signal Systems</h4>\n<p class=\"ppara\"><span class=\"pnum\">1</span><span>Long before Samuel F. B. Morse electrically transmitted his famous message “What hath God wrought?” from Washington to Baltimore on May 24, 1844, there were signaling systems that enabled people to communicate over distances. Most were visual or “semaphore” systems using flags or lights. In the eighteenth century, such systems used an observer who would decipher a signal from a high tower on a distant hill and then send it on to the next station. The young American republic wanted just such a system along its entire Atlantic coast and offered a prize of $30,000 for a workable proposal. The framers of this legislation<sup>1</sup> had no way of knowing that when they used the word “telegraph” to refer to this visual semaphore system, they would be offered an entirely new and revolutionary means of communication—electricity.</span></p>\n<h4 class=\"phead\">The Growth of an Idea</h4>\n<p class=\"ppara\"><span class=\"pnum\">2</span><span>The idea of using electricity to communicate over distance is said to have occurred to Morse during a conversation aboard ship when he was returning from Europe in 1832. Michael Faraday’s recently invented electromagnet was much discussed by the ship’s passengers, and when Morse came to understand how it worked, he speculated that it might be possible to send a coded message over a wire. While a student at Yale College years before, he had written his parents a letter about how interesting he found the lectures on electricity. Despite what he had learned at Yale, Morse found when he began to develop his idea that he had little real understanding of the nature of electricity, and after sporadic attempts to work with batteries, magnets, and wires, he finally turned for help to a colleague at the University of the City of New York, Leonard D. Gale.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">3</span><span>Gale was a professor of chemistry and familiar with the electrical work of Princeton’s Joseph Henry, a true pioneer in the new field. Well before Morse had his shipboard idea about a telegraph, Henry rang a bell at a distance by opening and closing an electric circuit. In 1831, he had published an article, of which Morse was unaware, that contained details suggesting the idea of an electric telegraph. Gale’s help and his knowledge of this article proved crucial to Morse’s telegraph system because Gale not only pointed out flaws in the system but showed Morse how he could regularly boost the strength of a signal and overcome the distance problems he had encountered by using a relay system Henry had invented. Henry’s experiments, Gale’s assistance, and, soon after, hiring the young technician Alfred Vail were keys to Morse’s success.</span></p>\n<h4 class=\"phead\">Obstacles and Opportunities</h4>\n<p class=\"ppara\"><span class=\"pnum\">4</span><span>By December 1837, Morse had enough confidence in his new system to apply for the federal government’s appropriation, and during the next year he conducted demonstrations of his telegraph both in New York and Washington.</span></p>\n<p class=\"pnote\"><sup>1</sup>legislation: Telegraph Bill</p>\n<p class=\"ppara\"><span class=\"pnum\">5</span><span>However, when the economic disaster known as the Panic of 1837 took hold of the nation and caused a long depression, Morse was forced to wait for better times. It was during this period that Morse visited Europe again and tried not only to secure patent protection overseas but to examine competing telegraph systems in England. . . .</span></p>\n<p class=\"ppara\"><span class=\"pnum\">6</span><span>By 1843, the country was beginning to recover economically, and Morse again asked Congress for the $30,000 that would allow him to build a telegraph line from Washington to Baltimore, forty miles away. The House of Representatives eventually passed the bill containing the Morse appropriation, and the Senate approved it in the final hours of that Congress’s last session. With President Tyler’s signature, Morse received the cash he needed and began to carry out plans for an underground telegraph line.</span></p>\n<h4 class=\"phead\">Realizing a Great Invention</h4>\n<p class=\"ppara\"><span class=\"pnum\">7</span><span>Morse had hired the ingenious construction engineer Ezra Cornell to lay the pipe carrying the wire, and although Cornell did his job superbly, one of Morse’s partners, Congressman F. O. J. Smith, had purchased wire with defective insulation. Too much time had been wasted laying bad wire, and with the project on a rigid deadline, something had to be done quickly. Cornell suggested that the fastest and cheapest way of connecting Washington and Baltimore was to string wires overhead on trees and poles. The desperate Morse gave the go-ahead, and the line was completed in time for the dramatic and spectacularly successful link between the Supreme Court chamber of the Capitol building and the railroad station in Baltimore.</span></p>\n<p class=\"ppara\"><span class=\"pnum\">8</span><span>Soon, as overhead wires connected cities up and down the Atlantic coast, the dots-and-dashes method<sup>2</sup> that recorded messages on a long moving strip of paper was replaced by the operator’s ability to interpret the code in real time. . . . Telegraph lines soon extended westward, and within Morse’s own lifetime they connected the continents of Europe and America.</span></p>\n<p class=\"pcredit\">“Invention of the Telegraph”—Public Domain/Library of Congress</p>\n<p class=\"pnote\"><sup>2</sup>dots-and-dashes method: the short and long pulses of Morse code that are sent and received by telegraph operators</p>\n<figure class=\"pfig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABgYAAAQPCAIAAABUW8eHAAEAAElEQVR4nOzddVgUXRcA8LO9dKeCSCgIKmUAdhcq2N3d3V3Y3S12dwCChIoioXSHdDe7y8b7x+i86xICYnJ+z/t83+ydOzN32RV2z9x7DkUkEgFCCCGEEEI s": [{"key": "ela", "label": "English Language Arts", "items": [{"sec": "ela", "src": "1", "text": null, "stem": "<p>Read this sentence.</p>\n<blockquote>The Colosseum in Rome, Italy which is considered one of the “new” Seven Wonders of the World, is the largest amphitheater ever built and could hold more than 50,000 spectators.</blockquote>\n<p>Which edit should be made to correct the sentence?</p>", "fig": null, "choices": [{"l": "A", "h": "Delete the comma after Rome."}, {"l": "B", "h": "Insert a comma after Italy."}, {"l": "C", "h": "Delete the comma after World."}, {"l": "D", "h": "Insert a comma after built."}], "answer": "B", "n": 1, "type": "mc"}, {"sec": "ela", "src": "2", "text": null, "stem": "<p>Read this paragraph.</p>\n<blockquote>In September 2016 the National Museum of African American History and Culture opened as part of the Smithsonian Institution, the museum is already the Smithsonian’s third most popular site. Experts say that they expect this newest Smithsonian facility to welcome nearly 4 million visitors a year. The museum features more than 30,000 objects, including Muhammad Ali’s boxing gloves and a dress sewn by Rosa Parks. A commemorative copy of the Emancipation Proclamation, written in 1863 during the presidency of Abraham Lincoln, is also on display at the museum.</blockquote>\n<p>Which revision corrects the error in sentence structure in the paragraph?</p>", "fig": null, "choices": [{"l": "E", "h": "Institution, and the"}, {"l": "F", "h": "year, and the"}, {"l": "G", "h": "objects, which include"}, {"l": "H", "h": "Proclamation, which was written"}], "answer": "E", "n": 2, "type": "mc"}, {"sec": "ela", "src": "3", "text": null, "stem": "<p>Read this sentence.</p>\n<blockquote>To promote their club, a bake sale will be sponsored by members of the debate team on Wednesday.</blockquote>\n<p>How should the sentence be revised?</p>", "fig": null, "choices": [{"l": "A", "h": "To promote their club, on Wednesday a bake sale will be sponsored by members of the debate team."}, {"l": "B", "h": "On Wednesday to promote their club, a bake sale will be sponsored by members of the debate team."}, {"l": "C", "h": "To promote their club, members of the debate team will sponsor a bake sale on Wednesday."}, {"l": "D", "h": "Members of the debate team, on Wednesday to promote their club, will sponsor a bake sale."}], "answer": "C", "n": 3, "type": "mc"}, {"sec": "ela", "src": "4", "text": null, "stem": "<p>Read this paragraph.</p>\n<blockquote>(1) Devon spent several hours preparing for an upcoming audition for a play at the community theater. (2) First he did vocal exercises to practice his diction and projection so that his words would carry clearly throughout the large auditorium. (3) Then he studies the text of the monologue to better understand the emotions, and motivations of the character he plans to portray. (4) Finally he recited his monologue in front of a mirror many times, making slight adjustments and improvements to his performance each time.</blockquote>\n<p>How should the paragraph be revised?</p>", "fig": null, "choices": [{"l": "E", "h": "Sentence 1: Change spent to had spent, AND insert a comma after play."}, {"l": "F", "h": "Sentence 2: Change did to does, AND insert a comma after projection."}, {"l": "G", "h": "Sentence 3: Change studies to studied, AND delete the comma after emotions."}, {"l": "H", "h": "Sentence 4: Change recited to recites, AND delete the comma after times."}], "answer": "G", "n": 4, "type": "mc"}, {"sec": "ela", "src": "5", "text": "lib", "stem": "<p>Which sentence should replace sentence 4 to best introduce the main claim of the passage?</p>", "fig": null, "choices": [{"l": "A", "h": "In this age of smartphones and search engines, the public library is a valuable resource that all members of a community should use."}, {"l": "B", "h": "Finding information is easier than ever, but going to the public library is still a valuable learning experience."}, {"l": "C", "h": "Though today’s computers are highly advanced, the resources available at a public library are more useful for students."}, {"l": "D", "h": "Despite the proliferation of social networking sites, a public library is a great place for people who are interested in improving their community."}], "answer": "A", "n": 5, "type": "mc"}, {"sec": "ela", "src": "6", "text": "lib", "stem": "<p>Which sentence would best follow and support sentence 8?</p>", "fig": null, "choices": [{"l": "E", "h": "Libraries, which have been around for centuries and are found throughout the world today, help preserve the history of a community."}, {"l": "F", "h": "The public library is often used as a place for community leaders and organizers to host community events, such as hearings or town halls."}, {"l": "G", "h": "Libraries rely on a combination of local, state, and federal dollars to provide the kinds of services and programs that community members have come to expect."}, {"l": "H", "h": "At a public library, people can interact with others through a variety of programs, including teen book clubs, toddler story times, and senior-citizen exercise classes."}], "answer": "H", "n": 6, "type": "mc"}, {"sec": "ela", "src": "7", "text": "lib", "stem": "<p>Which revision of sentence 12 best maintains the formal style established in the passage?</p>", "fig": null, "choices": [{"l": "A", "h": "The free resources available at the library can help people accomplish many tasks."}, {"l": "B", "h": "All the free materials you can get at the library can help you do many different tasks."}, {"l": "C", "h": "Everything that is free at the library can help people work on a lot of different things."}, {"l": "D", "h": "The free resources you can find at the library can help you do whatever you need to do."}], "answer": "A", "n": 7, "type": "mc"}, {"sec": "ela", "src": "8", "text": "lib", "stem": "<p>Where should sentence 17 be moved in order to improve the organization of the fourth paragraph (sentences 13–17)?</p>", "fig": null, "choices": [{"l": "E", "h": "to the beginning of the paragraph (before sentence 13)"}, {"l": "F", "h": "between sentences 13 and 14"}, {"l": "G", "h": "between sentences 14 and 15"}, {"l": "H", "h": "between sentences 15 and 16"}], "answer": "G", "n": 8, "type": "mc"}, {"sec": "ela", "src": "9", "text": "lib", "stem": "<p>Which concluding sentence should be added after sentence 19 to support the argument presented in the passage?</p>", "fig": null, "choices": [{"l": "A", "h": "Therefore, patrons of the public library can grow in both their social life and their level of community engagement."}, {"l": "B", "h": "Clearly, it is in the best interest of community members to maintain, support, and use their public library."}, {"l": "C", "h": "After all, the public library has been a part of American communities since the first library was founded in 1833."}, {"l": "D", "h": "In fact, community leaders must work together to find ways to generate more involvement in events at the public library."}], "answer": "B", "n": 9, "type": "mc"}, {"sec": "ela", "src": "10", "text": "tung", "stem": "<p>What evidence best indicated the location of the blast?</p>", "fig": null, "choices": [{"l": "E", "h": "a lake formed from a crater"}, {"l": "F", "h": "tremors recorded at a seismic station"}, {"l": "G", "h": "damage caused to buildings"}, {"l": "H", "h": "the position of the trunks of fallen trees"}], "answer": "H", "n": 10, "type": "mc"}, {"sec": "ela", "src": "11", "text": "tung", "stem": "<p>The June 30 date of the Tunguska event was significant to some scientists because it</p>", "fig": null, "choices": [{"l": "A", "h": "suggested that the explosion may have been caused by a comet."}, {"l": "B", "h": "highlighted why tree resin from the time of the blast contained high-proton elements."}, {"l": "C", "h": "indicated that the blast may have resulted from Earth’s impact with a black hole."}, {"l": "D", "h": "explained why debris from outer space would have burned up in the atmosphere."}], "answer": "A", "n": 11, "type": "mc"}, {"sec": "ela", "src": "12", "text": "tung", "stem": "<p>What did Galli’s analysis of tree resin at the site reveal?</p>", "fig": null, "choices": [{"l": "E", "h": "Certain elements were unusually abundant around the time of the blast."}, {"l": "F", "h": "Particles from outer space can add carbon atoms to trees."}, {"l": "G", "h": "Spruce trees were able to survive the Tunguska explosion."}, {"l": "H", "h": "Meteorites are composed of gold, copper, and other high-proton elements."}], "answer": "E", "n": 12, "type": "mc"}, {"sec": "ela", "src": "13", "text": "tung", "stem": "<p>Based on the passage, what is the most likely reason it took nineteen years from the date of the explosion before scientists first visited the Tunguska site?</p>", "fig": null, "choices": [{"l": "A", "h": "The scientists feared radioactivity from a nuclear explosion."}, {"l": "B", "h": "The site was far from civilization and difficult to reach."}, {"l": "C", "h": "Scientists hoped to establish a cause before exploring the site."}, {"l": "D", "h": "Craters from the explosion hampered travel to the area."}], "answer": "B", "n": 13, "type": "mc"}, {"sec": "ela", "src": "14", "text": "tung", "stem": "<p>What is the primary role of paragraph 1 in the structure of the passage?</p>", "fig": null, "choices": [{"l": "E", "h": "It explains the scientific importance of the explosion."}, {"l": "F", "h": "It indicates the magnitude of the explosion."}, {"l": "G", "h": "It provides possible causes of the explosion."}, {"l": "H", "h": "It describes the human suffering caused by the explosion."}], "answer": "F", "n": 14, "type": "mc"}, {"sec": "ela", "src": "15", "text": "tung", "stem": "<p>The author includes a series of questions at the end of the last paragraph most likely to</p>", "fig": null, "choices": [{"l": "A", "h": "encourage further study of the Tunguska event."}, {"l": "B", "h": "suggest that the Tunguska event had multiple causes."}, {"l": "C", "h": "reflect a personal curiosity about the Tunguska event."}, {"l": "D", "h": "emphasize that the Tunguska event has not yet been fully explained."}], "answer": "D", "n": 15, "type": "mc"}, {"sec": "ela", "src": "16", "text": "wild", "stem": "<p>In paragraph 2, how does the phrase “when all three had taken the trouble to tell her” affect the tone in the first part of the excerpt?</p>", "fig": null, "choices": [{"l": "E", "h": "It creates an accusatory tone by suggesting that Margaret believes that others are responsible for her problem."}, {"l": "F", "h": "It introduces a defiant tone by suggesting that Margaret left the train early to prove a point."}, {"l": "G", "h": "It suggests a frustrated tone by showing that Margaret feels confused by the inconsistent help offered by the railroad employees."}, {"l": "H", "h": "It establishes an appreciative tone by showing that Margaret feels cared for by the railroad employees."}], "answer": "E", "n": 16, "type": "mc"}, {"sec": "ela", "src": "17", "text": "wild", "stem": "<p>Which sentence from the excerpt best supports the idea that traveling to new places by train is unfamiliar to Margaret?</p>", "fig": null, "choices": [{"l": "A", "h": "“With a lurch the train came to a dead stop and Margaret Earle, hastily gathering up her belongings, hurried down the aisle and got out into the night.” (paragraph 1)"}, {"l": "B", "h": "“Perhaps something was the matter with the engine that detained them and they had forgotten her for the moment.” (paragraph 2)"}, {"l": "C", "h": "“Did they not have platforms in this wild Western land, or was the train so long that her car had stopped before reaching it?” (paragraph 3)"}, {"l": "D", "h": "“She could dimly see moving figures away up near the engine, and each one evidently carried a lantern.” (paragraph 4)"}], "answer": "C", "n": 17, "type": "mc"}, {"sec": "ela", "src": "18", "text": "wild", "stem": "<p>Read this sentence from paragraph 4.</p>\n<blockquote>Yet if the train started before she found the conductor she might be carried on somewhere and he justly blame her for a fool.</blockquote>\n<p>How does the sentence contribute to the development of the plot?</p>", "fig": null, "choices": [{"l": "E", "h": "It shows how Margaret’s reliance on the guidance of others leads to the external conflict she faces."}, {"l": "F", "h": "It reveals how Margaret’s concern about the opinions of others causes the external conflict she faces."}, {"l": "G", "h": "It highlights how Margaret’s indecision results in the external conflict being prolonged."}, {"l": "H", "h": "It illustrates how Margaret’s confusion makes it difficult for her to fully understand the external conflict."}], "answer": "F", "n": 18, "type": "mc"}, {"sec": "ela", "src": "19", "text": "wild", "stem": "<p>Read this sentence from paragraph 4.</p>\n<blockquote>She strained her eyes into the darkness, and tried to make out things from the two or three specks of light that danced about like fireflies in the distance.</blockquote>\n<p>The simile used in the sentence affects the tone of the paragraph by emphasizing a</p>", "fig": null, "choices": [{"l": "A", "h": "feeling of comfort as Margaret connects her unfamiliar surroundings with familiar images."}, {"l": "B", "h": "sense of lonesomeness as Margaret realizes that she is on her own in the wilderness."}, {"l": "C", "h": "sense of tranquility as Margaret is distracted from the urgency of her situation by the beauty of the night."}, {"l": "D", "h": "feeling of dread as Margaret regards the desolation of the land that surrounds her."}], "answer": "B", "n": 19, "type": "mc"}, {"sec": "ela", "src": "20", "text": "wild", "stem": "<p>Read paragraph 9 from the excerpt.</p>\n<blockquote>A moment of useless screaming, running, trying to attract some one’s attention, a sickening sense of terror and failure, and the last car slatted itself past with a mocking clatter, as if it enjoyed her discomfort.</blockquote>\n<p>The imagery in this sentence conveys the</p>", "fig": null, "choices": [{"l": "E", "h": "growing irritation Margaret feels as she is ignored by people on the train."}, {"l": "F", "h": "effort Margaret is making despite being physically unable to keep up with the train."}, {"l": "G", "h": "anger that Margaret is experiencing as she watches the train leave without her."}, {"l": "H", "h": "vulnerability Margaret feels as the train leaves her behind."}], "answer": "H", "n": 20, "type": "mc"}, {"sec": "ela", "src": "21", "text": "wild", "stem": "<p>How does Margaret’s experience in paragraph 9 emphasize a theme of the excerpt?</p>", "fig": null, "choices": [{"l": "A", "h": "It confirms Margaret’s understanding that she cannot rely on help from anyone else."}, {"l": "B", "h": "It leads Margaret to realize that her efforts to change her situation are ineffective."}, {"l": "C", "h": "It causes Margaret to believe that her own actions led to an unfavorable outcome."}, {"l": "D", "h": "It reinforces Margaret’s frustration about her lack of control over her surroundings."}], "answer": "B", "n": 21, "type": "mc"}, {"sec": "ela", "src": "22", "text": "wild", "stem": "<p>Read paragraph 10 from the excerpt.</p>\n<blockquote>Margaret stood dazed, reaching out helpless hands, then dropped them at her sides and gazed after the fast-retreating train, the light on its last car swinging tauntingly, blinking now and then with a leer in its eye, rapidly vanishing from her sight into the depth of the night.</blockquote>\n<p>What does the figurative language in this sentence emphasize?</p>", "fig": null, "choices": [{"l": "E", "h": "the sense of doubt that Margaret experiences when she is deciding what to do next"}, {"l": "F", "h": "the anger that Margaret feels toward the people on the train who she expected to help her"}, {"l": "G", "h": "the embarrassment that Margaret feels when she imagines what others will think of her"}, {"l": "H", "h": "the hopelessness that Margaret feels when she accepts that the train is continuing on"}], "answer": "H", "n": 22, "type": "mc"}, {"sec": "ela", "src": "23", "text": "wild", "stem": "<p>How does paragraph 11 contribute to the plot of the excerpt?</p>", "fig": null, "choices": [{"l": "A", "h": "It reveals that the reality of the situation is different from Margaret’s assumptions."}, {"l": "B", "h": "It illustrates that Margaret’s main problem is her own imagination."}, {"l": "C", "h": "It shows that Margaret is surprised by the unexpected adventure she is about to undertake."}, {"l": "D", "h": "It provides additional insight into how Margaret reacts to stressful situations."}], "answer": "A", "n": 23, "type": "mc"}, {"sec": "ela", "src": "24", "text": "wild", "stem": "<p>How do the details in paragraphs 12–13 about the setting help support the theme of the excerpt?</p>", "fig": null, "choices": [{"l": "E", "h": "They show that Margaret is overwhelmed by the darkness that surrounds her."}, {"l": "F", "h": "They suggest that the situation is frustrating but that Margaret is hopeful."}, {"l": "G", "h": "They reveal that the landscape is beautiful and that Margaret is alone."}, {"l": "H", "h": "They demonstrate that Margaret is easily discouraged and frightened."}], "answer": "G", "n": 24, "type": "mc"}, {"sec": "ela", "src": "32", "text": "arch", "stem": "<p>Which of the following best describes the goal of modern archaeology?</p>", "fig": null, "choices": [{"l": "E", "h": "to use science to learn how people lived in the past"}, {"l": "F", "h": "to find artwork from ancient civilizations"}, {"l": "G", "h": "to search for evidence of ancient settlements"}, {"l": "H", "h": "to uncover precious objects for display in museums"}], "answer": "E", "n": 25, "type": "mc"}, {"sec": "ela", "src": "33", "text": "arch", "stem": "<p>What would a traditional archaeologist be most interested in finding at a site like Kourion?</p>", "fig": null, "choices": [{"l": "A", "h": "a human skeleton"}, {"l": "B", "h": "beautiful jewelry or ceramics"}, {"l": "C", "h": "evidenc , "h": "to introduce the topic of other artifacts discovered near Camelia"}, {"l": "B", "h": "to contrast this position with that of the paleobotanist"}, {"l": "C", "h": "to complete the list of archaeological specialists"}, {"l": "D", "h": "to provide an example of a particular field in modern archaeology"}], "answer": "D", "n": 30, "type": "mc"}, {"sec": "ela", "src": "38", "text": "poem", "stem": "<p>The description in the first stanza (lines 1–7) helps establish a central idea of the poem by</p>", "fig": null, "choices": [{"l": "E", "h": "comparing the length of time the mountains have existed with the length of time the city has existed."}, {"l": "F", "h": "contrasting the grandeur of the mountains with the structures in the city below them."}, {"l": "G", "h": "implying that the mountains are a source of inspiration to the people in the city below."}, {"l": "H", "h": "suggesting that the mountains are larger than the people in the city realize."}], "answer": "F", "n": 31, "type": "mc"}, {"sec": "ela", "src": "39", "text": "poem", "stem": "<p>Read line 1 and line 15 from the poem.</p>\n<blockquote>Higher and still more high,</blockquote>\n<blockquote>Vaster and still more vast,</blockquote>\n<p>The parallel structure of the two lines</p>", "fig": null, "choices": [{"l": "A", "h": "emphasizes how the sense of wonder the speaker has at the beginning of the poem changes to a fear of the mountains."}, {"l": "B", "h": "reinforces the sense of awe the speaker experiences when considering the magnificence of the expansive mountains."}, {"l": "C", "h": "reveals that the mountains are continually expanding both in height and land mass."}, {"l": "D", "h": "stresses a contrast between the height of the mountains and the area of land the mountains cover."}], "answer": "B", "n": 32, "type": "mc"}, {"sec": "ela", "src": "40", "text": "poem", "stem": "<p>Read line 5 from the poem.</p>\n<blockquote>Pillars of the sky at rest</blockquote>\n<p>The line helps develop the theme of h": "“Plasters their cliffs with soap-advertisements,” (line 13)"}], "answer": "D", "n": 36, "type": "mc"}, {"sec": "ela", "src": "44", "text": "poem", "stem": "<p>Which detail from the poem reflects the speaker’s view that people often fail to appreciate what is familiar?</p>", "fig": null, "choices": [{"l": "E", "h": "“The mountains from the great plateau” (line 6)"}, {"l": "F", "h": "“They have been here now for too long a time.” (line 9)"}, {"l": "G", "h": "“Splits down their shining sides,” (line 12)"}, {"l": "H", "h": "“To which the future is as was the past,” (line 18)"}], "answer": "F", "n": 37, "type": "mc"}, {"sec": "ela", "src": "45", "text": "poem", "stem": "<p>How do the details in the third stanza (lines 15–26) contribute to the development of the theme of the poem?</p>", "fig": null, "choices": [{"l": "A", "h": "by reflecting nature’s capacity to resist change"}, {"l": "B", "h": "by showing that nature is capable of influencing human will"}, {"l": "C", "h": "by exposing how a lack of awareness leads to nature’s ruin"}, {"l": "D", "h": "by explaining why people must respect nature"}], "answer": "A", "n": 38, "type": "mc"}, {"sec": "ela", "src": "46", "text": "poem", "stem": "<p>Read lines 21–22 from the poem.</p>\n<blockquote>Barrier broken down by those who do not need<br>The joy of time-resisting storm-worn stone,</blockquote>\n<p>How do the lines help convey the speaker’s point of view?</p>", "fig": null, "choices": [{"l": "E", "h": "They suggest that the speaker wants to remove the obstacles that prevent others from experiencing the wonders of nature."}, {"l": "F", "h": "They reveal the speaker’s opinion that some people are too busy to appreciate natural beauty."}, {"l": "G", "h": "They suggest the speaker’s dismay that people destroy the natural landscape without understanding the ramifications of their actions."}, {"l": "H", "h": "They explain that the speaker is confident that nature will never be fully destroyed by people."}], "answer": "G", "n": 39, "type": "mc"}, {"sec": "ela", "src": "47", "text": "poem", "stem": "<p>Read lines 23–26 from the poem.</p>\n<blockquote>The mountains swing along<br>The south horizon of the sky;<br>Welcoming with wide floors of blue-green ice<br>The mists that dance and drive before the sun.</blockquote>\n<p>The personification in these concluding lines of the poem suggests that the mountains are</p>", "fig": null, "choices": [{"l": "A", "h": "gracious hosts who are untroubled by the actions of people."}, {"l": "B", "h": "unaware of their coming destruction."}, {"l": "C", "h": "lively entertainers who are not bothered by the everyday concerns of people."}, {"l": "D", "h": "too proud to reveal their pain."}], "answer": "A", "n": 40, "type": "mc"}, {"sec": "ela", "src": "48", "text": "tele", "stem": "<p>Which statement describes how the author’s use of problem-solution in paragraph 2 contributes to the development of ideas in the passage?</p>", "fig": null, "choices": [{"l": "E", "h": "Morse’s discussion on a ship about Faraday’s electromagnet reminded him of the Yale College lectures on electricity, which he had enjoyed but had not fully understood, inspiring him to learn more about electricity from his colleague Gale."}, {"l": "F", "h": "Morse’s discouragement over his lack of knowledge of electricity prompted him to experiment with batteries, magnets, and wires, which led to the development of a new long-distance communication system."}, {"l": "G", "h": "Morse’s difficulty in understanding how Faraday’s electromagnet worked was frustrating, and it pushed him to create a system for sending signals over wires."}, {"l": "H", "h": "Morse’s longtime fascination was not enough to make up for his lack of knowledge about electricity, so he eventually sought help from Gale."}], "answer": "H", "n": 41, "type": "mc"}, {"sec": "ela", "src": "49", "text": "tele", "stem": "<p>Which statement describes how the author’s use of sequencing in paragraph 3 contributes to the overall structure of the passage?</p>", "fig": null, "choices": [{"l": "A", "h": "It shows that several people were simultaneously attempting to create an electric telegraph."}, {"l": "B", "h": "It shows how the invention of the electric telegraph depended on information and techniques discovered by others."}, {"l": "C", "h": "It shows that multiple means of long-distance communication were being used at the same time."}, {"l": "D", "h": "It shows how quickly long-distance communication changed from visual signals to electrical signals."}], "answer": "B", "n": 42, "type": "mc"}, {"sec": "ela", "src": "50", "text": "tele", "stem": "<p>Read this sentence from paragraph 7.</p>\n<blockquote>The desperate Morse gave the go-ahead, and the line was completed in time for the dramatic and spectacularly successful link between the Supreme Court chamber of the Capitol building and the railroad station in Baltimore.</blockquote>\n<p>The words “dramatic” and “spectacularly” in the sentence convey a</p>", "fig": null, "choices": [{"l": "E", "h": "sense of relief and fulfillment that the line was finished."}, {"l": "F", "h": "sense of wonder and of celebration that the telegraph line was completed on time."}, {"l": "G", "h": "feeling of excitement about the future possibilities of the telegraph."}, {"l": "H", "h": "feeling of confidence about being able to continue the work."}], "answer": "F", "n": 43, "type": "mc"}, {"sec": "ela", "src": "51", "text": "tele", "stem": "<p>Which excerpt from the passage supports the idea that Morse was aware of his limitations?</p>", "fig": null, "choices": [{"l": "A", "h": "“After sporadic attempts to work with batteries, magnets, and wires, he finally turned for help to a colleague.” (paragraph 2)"}, {"l": "B", "h": "“Gale’s help and his knowledge of this article proved crucial to Morse’s telegraph system.” (paragraph 3)"}, {"l": "C", "h": "“Henry’s experiments, Gale’s assistance, and, soon after, hiring the young technician Alfred Vail were keys to Morse’s success.” (paragraph 3)"}, {"l": "D", "h": "“Morse had hired the ingenious construction engineer Ezra Cornell to lay the pipe carrying the wire.” (paragraph 7)"}], "answer": "A", "n": 44, "type": "mc"}, {"sec": "ela", "src": "52", "text": "tele", "stem": "<p>The details of the section “The Growth of an Idea” convey a central idea of the passage by suggesting that</p>", "fig": null, "choices": [{"l": "E", "h": "the collaborative efforts of colleagues resulted in successful communication over a wire."}, {"l": "F", "h": "a great deal of interest and work was devoted to understanding how to use electricity to send signals."}, {"l": "G", "h": "Faraday’s invention of the electromagnet inspired the invention of the telegraph."}, {"l": "H", "h": "colleges like Yale played a great role in making new discoveries about electricity and its applications."}], "answer": "E", "n": 45, "type": "mc"}, {"sec": "ela", "src": "53", "text": "tele", "stem": "<p>How does the graph support the ideas in paragraph 8?</p>", "fig": null, "choices": [{"l": "A", "h": "It indicates how welcome the improvement of long-distance communication was in the United States."}, {"l": "B", "h": "It provides evidence of the dramatic increase in the number of telegraph messages as Morse’s system expanded across the United States."}, {"l": "C", "h": "It reveals that by the twentieth century millions of people had used the telegraph despite earlier hesitations about the system."}, {"l": "D", "h": "It shows how improvements that allowed Morse code to be read in real time made relaying telegraph messages faster and increased the system’s usage."}], "answer": "B", "n": 46, "type": "mc"}, {"sec": "ela", "src": "54", "text": "tele", "stem": "<p>Which sentence is the best summary of how Morse obtained the funding necessary to build his telegraph system?</p>", "fig": null, "choices": [{"l": "E", "h": "Morse applied for a federal grant that was delayed until 1843, so he spent time traveling in Europe, where he concentrated on obtaining a patent for his system."}, {"l": "F", "h": "Morse applied for a government grant that required both houses of Congress and the president to pass a bill awarding him $30,000 for his telegraph project."}, {"l": "G", "h": "Morse applied for a government appropriation and conducted telegraph demonstrations to show that his system could work, and after a delay caused by a financial depression, Congress approved the $30,000 appropriation in 1843."}, {"l": "H", "h": "Working with Gale and Vail allowed Morse to find flaws in Henry’s work and to develop his own ideas before applying for the federal government appropriation."}], "answer": "G", "n": 47, "type": "mc"}, {"sec": "ela", "src": "55", "text": "tele", "stem": "<p>How does the map provide additional support for a central idea of the passage?</p>", "fig": null, "choices": [{"l": "A", "h": "by demonstrating that Morse’s telegraph system greatly exceeded the limitations of previous long-distance communication systems"}, {"l": "B", "h": "by indicating that Morse was lacking foresight by seeking a patent only in North America"}, {"l": "C", "h": "by proving that Gale’s advice helped Morse extend the telegraph’s range much farther than first thought possible"}, {"l": "D", "h": "by providing a graphic that shows the surprisingly immense influence Morse’s telegraph had across the world"}], "answer": "D", "n": 48, "type": "mc"}, {"sec": "ela", "src": "56", "text": "tele", "stem": "<p>The idea that, in the mid-nineteenth century, the United States was mostly unaware of the possibilities of electricity is illustrated in the passage mainly through the</p>", "fig": null, "choices": [{"l": "E", "h": "description of the government’s initial desire to expand a semaphore signaling system that used either flags or lights along the Atlantic Coast."}, {"l": "F", "h": "delay by the House of Representatives to pass the bill funding Morse’s telegraph line six years after he first applied for the appropriation."}, {"l": "G", "h": "discussions of the newly invented electromagnet that sparked the idea of sending codes through wires."}, {"l": "H", "h": "description of how an electric circuit could be closed to ring a bell at a distance."}], "answer": "E", "n": 49, "type": "mc"}, {"sec": "ela", "src": "57", "text": "tele", "stem": "<p>With which statement would the author most likely agree?</p>", "fig": null, "choices": [{"l": "A", "h": "Morse’s telegraph was successful because the wires were strung aboveground rather than underground as originally planned."}, {"l": "B", "h": "Understanding the importance of Morse’s telegraph requires detailed knowledge of electrical systems."}, {"l": "C", "h": "The implementation of Morse’s telegraph system was overly influenced by economic factors."}, {"l": "D", "h": "Morse’s invention of the telegraph made a great stride toward better connecting people across the United States and across the world."}], "answer": "D", "n": 50, "type": "mc"}]}, {"key": "math", "label": "Mathematics", "items": [{"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<div class='disp'><span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">8</span></span> + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span> + <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span> =</div>", "n": 1, "answer": "D", "choices": [{"l": "A", "h": "<span class=\"frac\"><span class=\"num\">5</span><span class=\"den\">14</span></span>"}, {"l": "B", "h": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">8</span></span>"}, {"l": "C", "h": "1"}, {"l": "D", "h": "1<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">8</span></span>"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<div class='disp'>0.6 &times; 0.05 =</div>", "n": 2, "answer": "H", "choices": [{"l": "E", "h": "0.00003"}, {"l": "F", "h": "0.0003"}, {"l": "G", "h": "0.003"}, {"l": "H", "h": "0.03"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>What is 35% of 240?</p>", "n": 3, "answer": "A", "choices": [{"l": "A", "h": "84"}, {"l": "B", "h": "96"}, {"l": "C", "h": "108"}, {"l": "D", "h": "156"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>A bag contains 12 red counters and 18 blue counters and no others. What is the ratio of red counters to the total number of counters, in lowest terms?</p>", "n": 4, "answer": "H", "choices": [{"l": "E", "h": "2 : 3"}, {"l": "F", "h": "3 : 5"}, {"l": "G", "h": "3 : 2"}, {"l": "H", "h": "2 : 5"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>If 7<i>x</i> &minus; 9 = 4<i>x</i> + 15, what is the value of <i>x</i>?</p>", "n": 5, "answer": "C", "choices": [{"l": "A", "h": "2"}, {"l": "B", "h": "6"}, {"l": "C", "h": "8"}, {"l": "D", "h": "24"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>A rope is 2.5 meters long. What is its length in centimeters? <i>(Note: 1 meter = 100 centimeters.)</i></p>", "n": 6, "answer": "F", "choices": [{"l": "E", "h": "25"}, {"l": "F", "h": "250"}, {"l": "G", "h": "2,500"}, {"l": "H", "h": "0.025"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>Dev scored 82, 90, 76, 88, and 94 on five quizzes. What is the mean of his five scores?</p>", "n": 7, "answer": "B", "choices": [{"l": "A", "h": "84"}, {"l": "B", "h": "86"}, {"l": "C", "h": "88"}, {"l": "D", "h": "90"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>In the figure below, three rays meet a straight line at the same point.</p><div class=\"fig\"><svg viewBox=\"0 0 480 220\" width=\"480\" height=\"220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"40\" y1=\"190\" x2=\"440\" y2=\"190\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"240\" y1=\"190\" x2=\"128.528\" y2=\"89.6304\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"240\" y1=\"190\" x2=\"303.393\" y2=\"54.0538\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><circle cx=\"240\" cy=\"190\" r=\"3.6\" fill=\"#1a2433\"/><path d=\"M 210.274 163.235 A 40 40 0 0 0 200 190\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"172.782\" y=\"169.198\" text-anchor=\"middle\" font-size=\"16\" >42&deg;</text><path d=\"M 256.905 153.748 A 40 40 0 0 0 210.274 163.235\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"225.646\" y=\"124.445\" text-anchor=\"middle\" font-size=\"16\" ><tspan font-style='italic'>x</tspan>&deg;</text><path d=\"M 280 190 A 40 40 0 0 0 256.905 153.748\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"300.724\" y=\"156.314\" text-anchor=\"middle\" font-size=\"16\" >65&deg;</text></svg></div><p>What is the value of <i>x</i>?</p>", "n": 8, "answer": "H", "choices": [{"l": "E", "h": "23"}, {"l": "F", "h": "42"}, {"l": "G", "h": "65"}, {"l": "H", "h": "73"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>If <i>a</i> = 5 and <i>b</i> = &minus;3, what is the value of 2<i>a</i> &minus; 4<i>b</i>?</p>", "n": 9, "answer": "D", "choices": [{"l": "A", "h": "&minus;2"}, {"l": "B", "h": "10"}, {"l": "C", "h": "17"}, {"l": "D", "h": "22"}]}, {"sec": "math", "type": "grid", "text": null, "fig": null, "stem": "<div class='disp'>&radic;<span class='ovl'>&nbsp;121&nbsp;</span> + &radic;<span class='ovl'>&nbsp;49&nbsp;</span></div><p>What is the value of the expression above?</p>", "n": 10, "answer": "18", "choices": []}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>Eighteen identical pens cost $13.50. At this rate, what is the cost of 7 of these pens?</p>", "n": 11, "answer": "A", "choices": [{"l": "A", "h": "$5.25"}, {"l": "B", "h": "$5.40"}, {"l": "C", "h": "$6.75"}, {"l": "D", "h": "$7.50"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>When a certain whole number is divided by 6, the remainder is 4. Which of the following could be that number?</p>", "n": 12, "answer": "G", "choices": [{"l": "E", "h": "42"}, {"l": "F", "h": "45"}, {"l": "G", "h": "58"}, {"l": "H", "h": "60"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>The length of a rectangle is 3 times its width. The perimeter of the rectangle is 64 centimeters. What is the length of the rectangle?</p>", "n": 13, "answer": "C", "choices": [{"l": "A", "h": "8 cm"}, {"l": "B", "h": "16 cm"}, {"l": "C", "h": "24 cm"}, {"l": "D", "h": "32 cm"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<div class='disp'>|&minus;9| &minus; |5 &minus; 12|</div><p>What is the value of the expression above?</p>", "n": 14, "answer": "F", "choices": [{"l": "E", "h": "&minus;16"}, {"l": "F", "h": "2"}, {"l": "G", "h": "14"}, {"l": "H", "h": "16"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>A print shop charges a flat fee of $8 for an order, plus $3 for each poster in the order. Which expression gives the total cost, in dollars, of an order of <i>n</i> posters?</p>", "n": 15, "answer": "B", "choices": [{"l": "A", "h": "8<i>n</i> + 3"}, {"l": "B", "h": "3<i>n</i> + 8"}, {"l": "C", "h": "11<i>n</i>"}, {"l": "D", "h": "8(<i>n</i> + 3)"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>The six values below show the number of books read by each member of a reading group last year.</p><div class='disp'>14,&nbsp; 9,&nbsp; 21,&nbsp; 9,&nbsp; 17,&nbsp; 25</div><p>What is the median of these values?</p>", "n": 16, "answer": "F", "choices": [{"l": "E", "h": "14"}, {"l": "F", "h": "15.5"}, {"l": "G", "h": "16"}, {"l": "H", "h": "17"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<div class='disp'><span class=\"frac\"><span class=\"num\">(<i>x</i><sup>5</sup>)(<i>x</i><sup>3</sup>)</span><span class=\"den\"><i>x</i><sup>2</sup></span></span></div><p>Which expression is equivalent to the expression above?</p>", "n": 17, "answer": "A", "choices": [{"l": "A", "h": "<i>x</i><sup>6</sup>"}, {"l": "B", "h": "<i>x</i><sup>7</sup>"}, {"l": "C", "h": "<i>x</i><sup>10</sup>"}, {"l": "D", "h": "<i>x</i><sup>15</sup>"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<div class='disp'>3<sup>&minus;2</sup> + 3<sup>0</sup> &minus; 3<sup>&minus;1</sup></div><p>What is the value of the expression above?</p>", "n": 18, "answer": "E", "choices": [{"l": "E", "h": "<span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">9</span></span>"}, {"l": "F", "h": "1"}, {"l": "G", "h": "<span class=\"frac\"><span class=\"num\">13</span><span class=\"den\">9</span></span>"}, {"l": "H", "h": "9"}]}, {"sec": "math", "type": "mc", "text": null, "fig": null, "stem": "<p>In the figure below, <i>BCD</i> is a straight line segment.</p><div class=\"fig\"><svg viewBox=\"0 0 450 236\" width=\"450\" height=\"236\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"168,36 56,196 300,196\" fill=\"#eef2f7\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><line x1=\"300\" y1=\"196\" x2=\"414\" y2=\"196\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><text x=\"168\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">A</text><text x=\"40\" y=\"204\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">B</text><text x=\"294\" y=\"220\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">C</text><text x=\"428\" y=\"202\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">D</text><path d=\"M 92 196 A 36 36 0 0 0 76.6446 166.508\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"107.445\" y=\"174.215\" text-anchor=\"middle\" font-size=\"15\" >48&deg;</text><path d=\"M 148.502 63.8539 A 34 34 0 0 0 189.637 62.2267\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.4\"/><text x=\"170.213\" y=\"96.9562\" text-anchor
